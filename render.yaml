services:
  - type: static
    name: petcita-frontend
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/petcita build
    staticPublishPath: artifacts/petcita/dist
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        value: https://petcita.onrender.com
